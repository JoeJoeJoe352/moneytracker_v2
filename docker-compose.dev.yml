services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: dev-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
      - backend_target:/app/target
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/moneytracker?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: yP/NLoOH1NhizUUekbkBz9mzr1QKumOAQ4hTZF4mD7Q= # csak lokális dev célra
      MAVEN_OPTS: "--sun-misc-unsafe-memory-access=allow" # a "terminally deprecated method" warning hibaüzenet eltüntetése
    depends_on:
      db:
        condition: service_healthy # különben friss volume-nál a backend a MySQL inicializálása közben indulna el és leállna
    networks:
      - appnet

  frontend:
    build:
      context: ./angular
      dockerfile: Dockerfile.dev
    container_name: dev-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./angular:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - appnet

  db:
    image: mysql:8.4 # LTS; a tesztek (MySqlContainerTest) is ezt a verziót használják
    container_name: dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moneytracker
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # a -h 127.0.0.1 TCP-t kényszerít: az első indításkori inicializálás ideiglenes szervere csak socketen figyel,
      # így a sima "mysqladmin ping" túl korán jelezne egészségesnek
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - appnet

networks:
  appnet:

volumes:
  mysql_data:
  backend_target: