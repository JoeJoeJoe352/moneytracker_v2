<mat-card class="transaction-card-wrapper">
    <div class="transaction-card">
        <div
            class="transaction-icon-badge"
            [class.income]="isIncome()"
            [class.outcome]="!isIncome()"
        >
            <mat-icon
                aria-hidden="false"
                [fontIcon]="isIncome() ? 'arrow_upward' : 'arrow_downward'"
                [attr.aria-label]="
                    (isIncome() ? 'transaction.income' : 'transaction.expense') | translate
                "
            />
        </div>

        <div class="transaction-info">
            <div
                class="transaction-price"
                [class.income]="isIncome()"
                [class.outcome]="!isIncome()"
            >
                {{ transaction().priceSum | currencyFormat: transaction().wallet.currencyCode }}
            </div>
            <div class="transaction-base-data">
                <div class="transaction-name">{{ transaction().name }}</div>
                <div class="wallet-name">({{ transaction().wallet.name }})</div>
            </div>
            @if (categories()) {
                <div class="transaction-categories">{{ categories() }}</div>
            }
        </div>

        <div class="transaction-meta">
            <div class="transaction-date">{{ transaction().transactionDate }}</div>
        </div>
    </div>
</mat-card>
