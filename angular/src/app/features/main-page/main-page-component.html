<div class="stats-row">
    <div class="stats-col">
        <app-balance-card-component
            [isMoneySumLoading]="moneySummarizedPerCurrency.isLoading()"
            [moneySum]="moneySummarizedPerCurrency.value()?.moneySum ?? []"
            [incomeSumThisMonth]="moneySummarizedPerCurrency.value()?.incomeSumThisMonth ?? []"
            [expenseSumThisMonth]="moneySummarizedPerCurrency.value()?.expenseSumThisMonth ?? []"
        />
    </div>

    <div class="stats-col">
        <app-stat-card-component
            [isMoneySumLoading]="moneySummarizedPerCurrency.isLoading()"
            [walletSummaries]="moneySummarizedPerCurrency.value()?.incomeSumThisMonth ?? []"
            [transactionType]="transactionType.INCOME"
        />
    </div>

    <div class="stats-col">
        <app-stat-card-component
            [isMoneySumLoading]="moneySummarizedPerCurrency.isLoading()"
            [walletSummaries]="moneySummarizedPerCurrency.value()?.expenseSumThisMonth ?? []"
            [transactionType]="transactionType.OUTCOME"
        />
    </div>
</div>

<div class="transactions-row">
    <div class="transactions-col">
        <app-transactions-list-component
            [isHistoryMode]="false"
            [needSearchField]="false"
            [reloadTrigger]="reloadTransactionListTrigger()"
            (transactionsChanged)="reloadSummaryList()"
        />
    </div>
</div>
