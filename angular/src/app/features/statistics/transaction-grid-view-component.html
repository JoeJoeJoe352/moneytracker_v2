<div class="toggle-field">
    <div class="toggle-field-control">
        <span>{{ 'transaction.expenses' | translate }}</span>
        <mat-slide-toggle
            hideIcon
            class="mat-slide-toggle-income-expense"
            [aria-label]="'transaction.incomes' | translate"
            [checked]="!isExpenseMode()"
            (change)="isExpenseMode.set(!$event.checked)"
        />
        <span>{{ 'transaction.incomes' | translate }}</span>
    </div>
</div>

<div class="chart-container">
    <canvas baseChart type="bar" [data]="chartData()" [options]="options()"></canvas>
</div>
