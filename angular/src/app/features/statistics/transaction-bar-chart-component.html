<div class="chart-container">
    <canvas
        baseChart
        type="bar"
        role="img"
        [attr.aria-label]="
            summary().key
                | translate
                    : {
                          count: summary().params.count,
                          incomeCount: summary().params.incomeCount,
                          expenseCount: summary().params.expenseCount,
                          name: summary().params.name,
                          amount: summary().params.amount,
                      }
        "
        [data]="chartData()"
        [options]="chartOptions()"
    ></canvas>
</div>
