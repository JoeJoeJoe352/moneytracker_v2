<div
    class="wallet-card"
    role="button"
    tabindex="0"
    (click)="cardClicked.emit(walletData.id)"
    (keydown.enter)="cardClicked.emit(walletData.id)"
>
    <div class="wallet-flap">
        <span class="wallet-clasp"></span>
    </div>

    <div class="wallet-body">
        <span class="wallet-type-badge">{{
            walletDataUtil.getLangForWalletType(walletData.type) | translate
        }}</span>

        <div class="wallet-balance">
            <span class="wallet-balance-amount">{{ walletData.sum | number }}</span>
            <span class="wallet-balance-currency">{{
                walletData.currencyCode | currencySymbol
            }}</span>
        </div>

        <div class="wallet-card-bottom">
            <span class="wallet-name">{{ walletData.name }}</span>
            <span class="wallet-currency-code">{{
                walletDataUtil.getCurrencyTextForCurrencyCode(walletData.currencyCode) | translate
            }}</span>
        </div>
    </div>
</div>
