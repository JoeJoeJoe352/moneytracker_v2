@let wallet = walletData();
@let formattedSum = wallet.sum | currencyFormat: wallet.currencyCode;
<div
    class="wallet-card"
    role="button"
    tabindex="0"
    matRipple
    [class.disabled]="disabled()"
    [attr.aria-disabled]="disabled()"
    [attr.aria-label]="wallet.name + ', ' + formattedSum"
    (click)="onActivate()"
    (keydown.enter)="onActivate()"
    (keydown.space)="$event.preventDefault(); onActivate()"
>
    <div class="wallet-flap">
        <span class="wallet-clasp"></span>
    </div>

    <div class="wallet-body">
        <span class="wallet-type-badge">{{
            walletDataUtil.getLangForWalletType(wallet.type) | translate
        }}</span>

        <div class="wallet-balance">
            <span class="wallet-balance-amount">{{ formattedSum }}</span>
        </div>

        <div class="wallet-card-bottom">
            <span class="wallet-name">{{ wallet.name }}</span>
            <span class="wallet-currency-code">{{
                walletDataUtil.getCurrencyTextForCurrencyCode(wallet.currencyCode) | translate
            }}</span>
        </div>
    </div>
</div>
