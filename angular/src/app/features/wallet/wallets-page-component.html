<h1>{{ 'header.wallets' | translate }}</h1>
<mat-card appearance="outlined">
    <mat-card-actions [align]="'end'">
        <button matButton="filled" type="button" (click)="openWalletModal(null)">
            {{ 'wallet.create' | translate }}
        </button>
    </mat-card-actions>
    <mat-card-content aria-live="polite" [attr.aria-busy]="walletListResource.isLoading()">
        @if (walletListResource.isLoading()) {
            <div class="text-center">
                <mat-spinner [attr.aria-label]="'etc.loading' | translate" />
            </div>
        } @else {
            <app-wallets-list-component
                [walletListData]="walletListResource.value()"
                (walletCardClicked)="openWalletModal($event)"
            />
        }
    </mat-card-content>
</mat-card>
