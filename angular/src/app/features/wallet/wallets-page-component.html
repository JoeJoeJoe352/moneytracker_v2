<h1>{{ 'header.wallets' | translate }}</h1>
<mat-card appearance="outlined">
    <mat-card-actions [align]="'end'">
        <button matButton="filled" type="button" (click)="openWalletModal(null)">
            {{ 'wallet.create' | translate }}
        </button>
    </mat-card-actions>
    <mat-card-content>
        @if (isWalletListLoading()) {
            <div class="text-center">
                <mat-spinner />
            </div>
        } @else {
            <app-wallets-list-component
                [walletListData]="walletListData()"
                (walletCardClicked)="openWalletModal($event)"
            />
        }
    </mat-card-content>
</mat-card>
