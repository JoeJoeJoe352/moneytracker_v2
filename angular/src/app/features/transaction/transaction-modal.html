<h2 mat-dialog-title>
    {{ (data.transaction() ? 'transaction.update' : 'transaction.create') | translate }}
</h2>

<div aria-live="polite" [attr.aria-busy]="data.isDataInitializing()">
@if (data.isDataInitializing()) {
    <mat-dialog-content>
        <div class="text-center">
            <mat-spinner [attr.aria-label]="'etc.loading' | translate" />
        </div>
    </mat-dialog-content>
} @else {
    <app-transaction-form-component
        [isTransactionFormDisabled]="data.isTransactionFormDisabled()"
        [categoryList]="data.categories"
        [transaction]="data.transaction()"
        [addCategoryCallback]="data.addCategoryCallback"
        (deleted)="deleteTransactionRequested.emit($event)"
        (saved)="saved.emit($event)"
        [isCategorySaveInProgress]="data.isCategorySaveInProgress()"
    />
}
</div>
