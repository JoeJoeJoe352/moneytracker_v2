@if (isHistoryMode()) {
    <mat-card class="title-card">
        <mat-card-header>
            <h1 mat-card-title>{{ 'transaction_page.title' | translate }}</h1>
        </mat-card-header>
    </mat-card>
}

@if (needSearchField()) {
    <app-transaction-filter
        [defaultData]="filterInputDefaultValuesFromQuery"
        [isTransactionListLoading]="transactionListData.isLoading()"
        (filterSubmit)="onFilterSubmit($event)"
        (resetForm)="clearUrlParams()"
    />
}

@if (isHistoryMode() && isThereEnoughElementToShowChart()) {
    <app-transaction-bar-chart-component
        [transactionList]="transactionListData.value().transactions"
        (editTransaction)="modal.open($event.transactionId)"
    />
}

<app-transaction-list
    [title]="isHistoryMode() ? null : ('mainpage.last_transactions' | translate)"
    [listStatus]="transactionListData.status()"
    [transactions]="transactionListData.hasValue() ? transactionListData.value().transactions : []"
    (editTransaction)="modal.open($event.transactionId)"
/>

@let pageData = this.pageData();
@if (pageData) {
    <mat-paginator
        #paginator
        [aria-label]="'transaction_page.select_page' | translate"
        class="paginator"
        [length]="pageData.elementCount"
        [pageSize]="pageData.elementPerPage"
        [showFirstLastButtons]="true"
        [hidePageSize]="true"
        [pageIndex]="actualPageNumber()"
        (page)="handlePageChange($event)"
    >
    </mat-paginator>
}
