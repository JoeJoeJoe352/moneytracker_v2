@if (isHistoryMode()) {
    <mat-card class="title-card">
        <mat-card-header>
            <h1 mat-card-title>{{ 'transaction_page.title' | translate }}</h1>
        </mat-card-header>
    </mat-card>
}

@if (needSearchField()) {
    <app-transaction-filter
        [defaultData]="filterInputDefaultValuesFromQuery"
        [isTransactionListLoading]="transactionListData.isLoading()"
        (filterSubmit)="onFilterSubmit($event)"
        (resetForm)="clearInputs()"
    />
}
@if (isHistoryMode() && transactionListData.hasValue() && transactionListData.value().length > 0) {
    <app-transaction-grid-view-component
        [transactionList]="transactionListData.value()"
    />
} 
<app-transaction-list
    [title]="isHistoryMode() ? null : ('mainpage.last_transactions' | translate)"
    [listStatus]="transactionListData.status()"
    [transactions]="transactionListData.hasValue() ? transactionListData.value() : []"
    (editTransaction)="modal.open($event.transactionId)"
/>
