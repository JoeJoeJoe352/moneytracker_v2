@if (modal.isTransactionModalOpen()) {
    <app-create-transaction-modal
        [isTransactionFormDisabled]="modal.isTransactionFormDisabled()"
        [categories]="modal.categories"
        [transaction]="modal.transactionData()"
        [isCategorySaveInProgress]="modal.isAddingCategoryInProgress()"
        [isDataInitializing]="modal.isModalDataInitializing"
        (closeModal)="modal.close()"
        (deleteTransactionRequested)="modal.confirmDeletion($event)"
        (saved)="modal.save($event)"
        (categoryAdded)="modal.saveCategory($event)"
    />
}

@if (isHistoryMode) {
    <h1>{{ 'transaction_page.title' | translate }}</h1>
}

@if (needSearchField) {
    <div class="green-block">
        <!-- filter form -->
        <form [formGroup]="filterForm" (ngSubmit)="loadTransactionHistory()" class="form">
            <!-- Transaction name -->
            <div class="form-group mb-3">
                <label for="name">{{ 'transaction_page.filter.name' | translate }}</label>
                <input
                    id="name"
                    type="text"
                    formControlName="name"
                    class="form-control"
                    autocomplete="name"
                    [readonly]="isTransactionListLoading()"
                />
            </div>

            <!-- Transaction date -->
            <div class="form-group mb-3">
                <mat-form-field>
                    <mat-label>{{ 'transaction_page.filter.date' | translate }}</mat-label>
                    <input id="date" matInput [matDatepicker]="date" formControlName="date" />
                    <mat-hint>{{ "etc.datepicker.format" | translate}}</mat-hint>
                    <mat-datepicker-toggle matIconSuffix [for]="date" />
                    <mat-datepicker #date />
                </mat-form-field>
            </div>

            <button
                type="submit"
                [disabled]="isTransactionListLoading()"
                class="btn btn-green-hollow me-2"
            >
                {{ 'transaction_page.filter.submit' | translate }}
            </button>

            <button
                id="clear-filters"
                type="button"
                [disabled]="isTransactionListLoading()"
                class="btn btn-green-hollow"
                (click)="clearInputs()"
            >
                {{ 'transaction_page.filter.clear' | translate }}
            </button>
        </form>
    </div>
}

<app-transaction-list
    [title]="isHistoryMode ? null : ('mainpage.last_transactions' | translate)"
    [isTransactionListLoading]="isTransactionListLoading()"
    [transactions]="transactionListData()"
    (editTransaction)="modal.open($event.transactionId)"
/>
