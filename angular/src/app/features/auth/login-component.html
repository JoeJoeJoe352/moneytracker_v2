<h2 mat-dialog-title>{{ 'login.title' | translate }}</h2>
<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <mat-dialog-content>
        <div class="login-form-row">
            <!-- username -->
            <mat-form-field>
                <mat-label>
                    {{ 'login.username' | translate }}
                </mat-label>
                <input matInput id="username" type="text" formControlName="username" />
                @if (isUsernameFieldHasError) {
                    <mat-error>
                        {{ 'login.username.required-error' | translate }}
                    </mat-error>
                }
            </mat-form-field>

            <!-- password -->
            <mat-form-field>
                <mat-label>
                    {{ 'login.password' | translate }}
                </mat-label>
                <input matInput id="password" type="password" formControlName="password" />

                @if (isPasswordFieldHasError) {
                    <mat-error>
                        {{ 'login.password.required-error' | translate }}
                    </mat-error>
                }
            </mat-form-field>
        </div>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button mat-stroked-button type="button" mat-dialog-close>
            {{ 'etc.cancel' | translate }}
        </button>

        <button mat-flat-button type="submit" [disabled]="data.isloading()">
            {{ 'login.submit' | translate }}
        </button>
    </mat-dialog-actions>
</form>
