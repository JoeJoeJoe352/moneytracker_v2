@if (isTransactionModalOpen()) {
    <app-create-transaction-modal
        [isTransactionFormDisabled]="isTransactionFormDisabled()"
        [transaction]="transactionData()"
        (closeModal)="closeTransactionModal()"
        (deleteTransactionRequested)="popupDeletionConfirm($event)"
        (saved)="saveTransaction($event)"
    />
}

<h1>Transactions</h1>

<div>
    <button class="btn btn-primary-green" (click)="openTransactionModal(null)">
        {{ 'mainpage.create_transaction.button' | translate }}
    </button>
</div>

<div class="green-block">
    <!-- filter form -->
    <form [formGroup]="filterForm" (ngSubmit)="loadTransactionHistory()" class="form">
        <!-- Transaction name -->
        <div class="form-group mb-3">
            <label for="name">Transaction name</label>
            <input
                id="name"
                type="text"
                formControlName="name"
                class="form-control"
                autocomplete="name"
                [readonly]="isTransactionListLoading()"
            />
        </div>

        <!-- Transaction date -->
        <div class="form-group mb-3">
            <label for="date">Transaction date</label>
            <ngxsmk-datepicker
                id="date"
                mode="single"
                formControlName="date"
                placeholder="Select a date"
            />
        </div>

        <button
            type="submit"
            [disabled]="isTransactionListLoading()"
            class="btn btn-green-hollow me-2"
        >
            Search
        </button>

        <button
            type="button"
            [disabled]="isTransactionListLoading()"
            class="btn btn-green-hollow"
            (click)="clearInputs()"
        >
            Clear
        </button>
    </form>
</div>
<!-- Transaction list -->
@if (isTransactionListLoading()) {
    <div class="text-center">
        <div class="spinner-border" role="status"></div>
    </div>
} @else {
    @if (transactionListData() !== null && transactionListData().length > 0) {
        <app-transaction-list
            [transactions]="transactionListData()"
            (editTransaction)="openTransactionModal($event.transactionId)"
        />
    } @else {
        <p class="text-center">{{ 'mainpage.no_transaction' | translate }}</p>
    }
}
