@if (isTransactionModalOpen()) {
    <app-create-transaction-modal
        [isTransactionFormDisabled]="isTransactionFormDisabled()"
        [categories]="categories"
        [transaction]="transactionData()"
        [isCategorySaveInProgress]="isAddingCategoryInProgress()"
        (closeModal)="closeTransactionModal()"
        (deleteTransactionRequested)="popupDeletionConfirm($event)"
        (saved)="saveTransaction($event)"
    />
}

<h1>{{ 'transaction_page.title' | translate }}</h1>

<div class="green-block">
    <!-- filter form -->
    <form [formGroup]="filterForm" (ngSubmit)="loadTransactionHistory()" class="form">
        <!-- Transaction name -->
        <div class="form-group mb-3">
            <label for="name">{{ 'transaction_page.filter.name' | translate }}</label>
            <input
                id="name"
                type="text"
                formControlName="name"
                class="form-control"
                autocomplete="name"
                [readonly]="isTransactionListLoading()"
            />
        </div>

        <!-- Transaction date -->
        <div class="form-group mb-3">
            <label for="date">{{ 'transaction_page.filter.date' | translate }}</label>
            <ngxsmk-datepicker
                id="date"
                mode="single"
                formControlName="date"
                [placeholder]="'transaction_page.filter.date.placeholder' | translate"
            />
        </div>

        <button
            type="submit"
            [disabled]="isTransactionListLoading()"
            class="btn btn-green-hollow me-2"
        >
            {{ 'transaction_page.filter.submit' | translate }}
        </button>

        <button
            type="button"
            [disabled]="isTransactionListLoading()"
            class="btn btn-green-hollow"
            (click)="clearInputs()"
        >
            {{ 'transaction_page.filter.clear' | translate }}
        </button>
    </form>
</div>
<!-- Transaction list -->
<app-transaction-list
    [isTransactionListLoading]="isTransactionDataLoading()"
    [transactions]="transactionListData()"
    (editTransaction)="openTransactionModal($event.transactionId)"
/>
