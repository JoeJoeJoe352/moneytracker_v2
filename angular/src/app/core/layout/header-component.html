<header>
    <mat-toolbar>
        <div class="header-bar">
            @if (isSidebarHidden()) {
                <a class="brand" routerLink="/welcome">
                    <img src="assets/images/logo-color.svg" alt="" />
                    <span>Moneytracker</span>
                </a>
            }

            <app-language-switcher />

            @if (!isSidebarHidden()) {
                <div class="mobile-menu-button">
                    <button
                        mat-icon-button
                        class="menu-toggle"
                        type="button"
                        [attr.aria-label]="
                            (isMobileMenuOpen() ? 'header.menu.close' : 'header.menu.open')
                                | translate
                        "
                        aria-controls="app-sidebar-nav"
                        [attr.aria-expanded]="isMobileMenuOpen()"
                        (click)="toggleMenu()"
                    >
                        <mat-icon aria-hidden="true" fontIcon="menu"></mat-icon>
                    </button>
                </div>
            }
        </div>
    </mat-toolbar>
</header>
