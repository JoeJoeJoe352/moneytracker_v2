<div class="app-shell" [class.app-shell-no-sidebar]="!layoutStore.isSidebarVisible()">
    @if (layoutStore.isSidebarVisible()) {
        <button
            type="button"
            class="mobile-menu-backdrop"
            [class.mobile-menu-backdrop-open]="layoutStore.isMobileMenuOpen()"
            [tabIndex]="layoutStore.isMobileMenuOpen() ? 0 : -1"
            [attr.aria-label]="'header.menu.close' | translate"
            (click)="layoutStore.closeMobileMenu()"
        ></button>
        <app-sidebar
            id="app-sidebar-nav"
            role="navigation"
            class="app-shell-sidebar"
            [class.mobile-menu-open]="layoutStore.isMobileMenuOpen()"
            [class.mobile-menu-closed]="!layoutStore.isMobileMenuOpen()"
        />
    }
    <div class="app-shell-main">
        <app-header role="banner" class="app-shell-header" />
        <main class="app-shell-content" role="main">
            <router-outlet />
        </main>
    </div>
</div>
