<label class="switch {{ theme }}">
  <span class="label-text">{{ labelBefore }}</span>
  <input
    id="togglerCheckbox"
    type="checkbox"
    [checked]="checked"
    (change)="setChecked($event.target.checked)"
  />
  <span class="slider"></span>
  <span class="label-text">{{ labelAfter }}</span>
</label>
