<header>
    <mat-toolbar>
        <div class="header-bar">
            <app-language-switcher />

            <div class="mobile-menu-button">
                <button
                    mat-icon-button
                    class="menu-toggle"
                    type="button"
                    aria-label="Menu"
                    aria-controls="app-sidebar-nav"
                    [attr.aria-expanded]="isMobileMenuOpen"
                    (click)="toggleMenu()"
                >
                    <mat-icon aria-hidden="true" fontIcon="menu"></mat-icon>
                </button>
            </div>
        </div>
    </mat-toolbar>
</header>
