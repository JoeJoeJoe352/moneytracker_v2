@if (data.title) {
    <h2 mat-dialog-title>{{ data.title }}</h2>
}
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-stroked-button mat-dialog-close>
        {{ data.cancelLabel ?? ('etc.cancel' | translate) }}
    </button>
    <button mat-flat-button [class.mat-button-danger]="data.danger" [mat-dialog-close]="true">
        {{ data.confirmLabel ?? ('etc.confirm' | translate) }}
    </button>
</mat-dialog-actions>
